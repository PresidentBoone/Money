<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & Glows" subtitle="Elevation on dark + the money glows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 20px; background: var(--surface-page); }
  .row { display: flex; gap: 24px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 56px; background: var(--surface-card); border-radius: var(--radius-md); }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="t">shadow-md</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="t">shadow-lg</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--glow-green)"></div><div class="t">glow-green</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--glow-gold)"></div><div class="t">glow-gold</div></div>
    <div class="col"><div class="box" style="border-radius:999px;box-shadow:var(--glow-avatar)"></div><div class="t">glow-avatar</div></div>
  </div>
</body>
</html>
