<!-- @dsCard group="Type" viewport="700x180" name="Money Numerals" subtitle="Space Grotesk, tabular — the big profit figure" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); }
  .money { font-family: var(--font-numeric); font-weight: 700; font-variant-numeric: tabular-nums;
           letter-spacing: -0.01em; color: var(--green-400); text-shadow: var(--text-glow-green);
           font-size: 76px; line-height: 1; }
  .money .c { color: var(--text-mid); }
  .meta { margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
</style>
</head>
<body>
  <div class="money"><span class="c">$</span>14,820<span class="c">.50</span></div>
  <div class="meta">Space Grotesk · 700 · tabular-nums · var(--font-numeric)</div>
</body>
</html>
