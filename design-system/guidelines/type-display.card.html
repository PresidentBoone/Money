<!-- @dsCard group="Type" viewport="700x180" name="Display — Anton" subtitle="Loud condensed display for titles & milestone names" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); }
  .mega { font-family: var(--font-display); text-transform: uppercase; color: var(--text-hi);
          font-size: 84px; line-height: .9; letter-spacing: -0.02em; }
  .mega em { font-style: normal; color: var(--green-400); text-shadow: var(--text-glow-green); }
  .meta { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
</style>
</head>
<body>
  <div class="mega">WE'RE <em>RICH</em></div>
  <div class="meta">Anton · 400 · uppercase · tracking −0.02em · var(--font-display)</div>
</body>
</html>
