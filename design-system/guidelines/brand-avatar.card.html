<!-- @dsCard group="Brand" viewport="700x180" name="Cofounder Avatar" subtitle="The face that rides the road — circular, green-glow ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); display: flex; align-items: center; gap: 28px; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; flex: none;
            box-shadow: var(--glow-avatar); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .note { font-family: var(--font-mono); font-size: 12px; color: var(--text-mid); line-height: 1.8; }
  .note b { color: var(--text-hi); }
  .small { width: 56px; height: 56px; }
</style>
</head>
<body>
  <div class="avatar"><img src="../assets/cofounder-avatar.gif" alt="cofounder" /></div>
  <div class="avatar small"><img src="../assets/cofounder-avatar.gif" alt="cofounder" /></div>
  <div class="note">
    Drops into <b>&lt;Avatar /&gt;</b> &amp; rides the road.<br>
    Ring: <b>--glow-avatar</b> · always circular · object-fit: cover.<br>
    Swap per co-founder via the <b>src</b> prop.
  </div>
</body>
</html>
