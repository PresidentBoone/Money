<!-- @dsCard group="Type" viewport="700x150" name="Mono — JetBrains" subtitle="Ticker, timestamps, mile markers, system labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); display:flex; flex-direction:column; gap:10px; }
  .m { font-family: var(--font-mono); }
  .ticker { font-size: 14px; color: var(--green-400); }
  .ticker .label { color: var(--text-lo); }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-mid); }
  .stamp { font-size: 12px; color: var(--text-lo); }
</style>
</head>
<body>
  <div class="m eyebrow">// LIVE FROM STRIPE</div>
  <div class="m ticker"><span class="label">LAST PAYMENT ▸</span> +$49.00 · acme.co · 2 min ago</div>
  <div class="m stamp">UPDATED 2026-06-08 14:32:07 UTC · SETNFORGET SYSTEMS LLC</div>
</body>
</html>
