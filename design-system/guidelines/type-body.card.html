<!-- @dsCard group="Type" viewport="700x210" name="Body — Space Grotesk" subtitle="UI labels, subtitles, body copy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); display:flex; flex-direction:column; gap:11px; }
  .specimen { font-family: var(--font-sans); color: var(--text-body); display:flex; align-items:baseline; gap:14px; }
  .specimen .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); width: 92px; flex:none; }
  .s1 { font-size: 24px; font-weight: 600; color: var(--text-hi); }
  .s2 { font-size: 18px; font-weight: 500; color: var(--text-hi); }
  .s3 { font-size: 15px; font-weight: 400; }
  .s4 { font-size: 13px; font-weight: 400; color: var(--text-mid); }
</style>
</head>
<body>
  <div class="specimen"><span class="tag">xl / 600</span><span class="s1">Hire a Dev from India</span></div>
  <div class="specimen"><span class="tag">lg / 500</span><span class="s2">Montana Trip — locked until $3,000</span></div>
  <div class="specimen"><span class="tag">md / 400</span><span class="s3">Statistically we are basically Rockefeller right now.</span></div>
  <div class="specimen"><span class="tag">sm / 400</span><span class="s4">Cheeseburgers are within striking distance. Stay locked in.</span></div>
</body>
</html>
