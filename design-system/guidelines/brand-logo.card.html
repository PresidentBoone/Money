<!-- @dsCard group="Brand" viewport="700x180" name="SetNForget Logo" subtitle="Parent company wordmark — on cream and on ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--surface-page); display: flex; gap: 14px; }
  .panel { flex: 1; border-radius: var(--radius-md); border: 1px solid var(--border-hairline);
           display: flex; align-items: center; justify-content: center; padding: 22px; height: 110px; }
  .cream { background: var(--brand-cream); }
  .ink { background: var(--ink-850); }
  img { max-height: 64px; width: auto; }
  .ink img.mark { max-height: 80px; }
</style>
</head>
<body>
  <div class="panel cream"><img src="../assets/setnforget-logo.png" alt="SetNForget Systems" /></div>
  <div class="panel ink"><img class="mark" src="../assets/setnforget-mark.png" alt="N mark" /></div>
</body>
</html>
